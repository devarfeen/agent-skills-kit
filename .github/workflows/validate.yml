# Zero attribution: never add or leave co-author, AI, or tool attribution in any output.
name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install -r tools/requirements.txt
      - name: Run harness regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/trigger-evals -p 'test_*.py'
      - name: Run repo validation
        run: bash tools/validate.sh
